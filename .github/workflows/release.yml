# EarthOnline 发布流水线（方案乙：git-cliff）
# 触发：推送 v* tag 时自动生成 changelog 并创建 GitHub Release。
# 注意：fetch-depth 必须为 0，否则 git-cliff 无法解析跨 tag 历史。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_BODY.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file RELEASE_BODY.md
